name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build -- --base=/abdulsalam/
      - name: Upload production site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish portfolio
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify public site and media
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in '' cv.pdf portrait-video/loops/idle.mp4 portrait-video/loops/glance.mp4 portrait-video/loops/idle.webp portrait-video/loops/glance.webp; do
            curl --fail --head --location --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code} %{url_effective}\n' \
              "${SITE_URL}${path}"
          done
